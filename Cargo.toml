[workspace]
resolver = "2"
members = [
    "src/core",
    "src/proto",
    "src/fenrir",
    "src/garmr",
    "src/orthrus",
    "src/pack",
    "src/yggdrasil",
]
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/cerberus-project/cerberus"
authors = ["Cerberus Team <team@cerberus.local>"]
categories = ["network-programming", "security", "distributed-systems"]
keywords = ["cybersecurity", "distributed-systems", "swarm-intelligence", "threat-detection"]

[workspace.dependencies]
# Core
tokio = { version = "1.40", features = ["full", "tracing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "v7", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.5"

# Networking
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"
hyper = { version = "1.3", features = ["full", "http2"] }
quinn = "0.11"
rustls = { version = "0.23", features = ["fips", "std"] }
rustls-pemfile = "1.0"
rcgen = "0.12"

# Cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde", "zeroize"] }
x25519-dalek = "2.0"
rand = "0.8"
zeroize = "1.8"
secrecy = "0.10"

# Storage
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager", "script"] }
rocksdb = { version = "0.22", features = ["default"] }
lmdb = "0.5"

# Config
config = { version = "0.14", features = ["toml", "json"] }
figment = { version = "0.10", features = ["toml", "json", "env"] }

# Observability
metrics = "0.22"
prometheus = { version = "0.13", features = ["process"] }
opentelemetry = { version = "0.33", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33", features = ["tonic"] }
opentelemetry_sdk = { version = "0.33", features = ["trace", "metrics", "rt-tokio"] }

# Testing
testcontainers = { version = "0.18", features = ["default"] }
proptest = "1.0"
mockall = "0.12"

# CLI
clap = { version = "4.5", features = ["derive", "env", "help", "usage", "string", "wrap_help"] }

# Platform-specific
#[cfg(target_os = "windows")]
windows = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_Foundation",
    "Win32_System_Kernel",
    "Win32_Networking_WinSock",
] }

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 2
debug = true
overflow-checks = true