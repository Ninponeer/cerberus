[project]
name = "cerberus"
version = "0.1.0"
description = "Project Cerberus - Distributed Cyber Defense Research Initiative"
readme = "README.md"
license = {text = "AGPL-3.0"}
authors = [{name = "Cerberus Team", email = "team@cerberus.local"}]
maintainers = [{name = "Cerberus Team", email = "team@cerberus.local"}]
keywords = ["cybersecurity", "distributed-systems", "swarm-intelligence", "threat-detection", "research"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Distributed Computing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "click>=8.1",
    "rich>=13.7",
    "httpx>=0.27",
    "grpcio>=1.65",
    "grpcio-tools>=1.65",
    "protobuf>=5.27",
    "asyncpg>=0.29",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "networkx>=3.3",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "onnxruntime>=1.19",
    "prometheus-client>=0.19",
    "opentelemetry-api>=1.26",
    "opentelemetry-sdk>=1.26",
    "opentelemetry-exporter-otlp>=1.26",
    "cryptography>=42.0",
    "ed25519>=1.5",
    "spiffe>=0.1",
    "tenacity>=8.4",
    "structlog>=24.1",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "hypothesis>=6.98",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyright>=1.1",
    "pre-commit>=3.7",
    "bandit>=1.7",
    "safety>=3.2",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-mermaid2-plugin>=1.1",
]
analysis = [
    "pandas>=2.2",
    "polars>=1.10",
    "plotly>=5.22",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]
cli = [
    "typer>=0.12",
    "shellingham>=1.5",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cerberus*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "requires_docker: Tests requiring Docker",
    "requires_network: Tests requiring network",
]

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "TRY", # tryceratops
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "S101", # assert used (ok in tests)
    "PTH118", # os.path.join (ok for compatibility)
]
per-file-ignores = { "tests/**/*.py": ["S101", "S106", "PTH118"] }
exclude = [".venv", "dist", "build", "target", "node_modules"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.bandit]
exclude_dirs = ["tests", ".venv", "dist", "build"]
skips = ["B101", "B106"]

[tool.coverage.run]
source = ["src/cerberus"]
omit = ["*/tests/*", "*/test_*.py", "*/conftest.py"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == \"__main__\":",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 2
