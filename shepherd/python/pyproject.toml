[project]
name = "cerberus-shepherd"
version = "0.1.0"
description = "Cerberus Shepherd Python Bindings - Operator harness for the Cerberus swarm"
readme = "README.md"
license = {text = "MIT OR Apache-2.0"}
authors = [{name = "Cerberus Team", email = "team@cerberus.local"}]
maintainers = [{name = "Cerberus Team", email = "team@cerberus.local"}]
keywords = ["cerberus", "cybersecurity", "distributed-systems", "swarm-intelligence"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "click>=8.1",
    "rich>=13.7",
    "grpcio>=1.65",
    "protobuf>=5.27",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
analysis = [
    "pandas>=2.2",
    "polars>=1.10",
    "plotly>=5.22",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "networkx>=3.3",
    "numpy>=1.26",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/abi3"]
compatibility = "off"
manylinux = "manylinux_2_28"
skip-audit-wheel = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py38"
line-length = 100