[workspace]
resolver = "2"
members = [
    "cli",
    "lib",
]
exclude = ["python"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/cerberus-project/cerberus"
authors = ["Cerberus Team <team@cerberus.local>"]
categories = ["command-line-utilities", "network-programming", "security"]
keywords = ["cerberus", "shepherd", "c2c", "management-plane"]

[workspace.dependencies]
# Core
cerberus-core = { path = "../src/core", features = ["prost"] }
cerberus-yggdrasil = { path = "../src/yggdrasil", features = ["rocksdb"] }
cerberus-garmr = { path = "../src/garmr" }
cerberus-orthrus = { path = "../src/orthrus" }
cerberus-proto = { path = "../src/proto" }
tokio = { version = "1.40", features = ["full", "tracing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "v7", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.5"
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde", "zeroize"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager", "script"] }
config = { version = "0.14", features = ["toml", "json"] }
figment = { version = "0.10", features = ["toml", "json", "env"] }
metrics = "0.22"
prometheus = { version = "0.13", features = ["process"] }
opentelemetry = { version = "0.33", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33", features = ["tonic"] }
opentelemetry-sdk = { version = "0.33", features = ["trace", "metrics", "rt-tokio"] }
clap = { version = "4.5", features = ["derive", "env", "help", "usage", "string", "wrap_help"] }
zeroize = "1.8"
secrecy = "0.10"

# Shepherd specific
spiffe = "0.1"
spire-api = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
url = "2.5"
miette = "7.0"
console = "0.15"
indicatif = "0.17"
dialoguer = "0.11"
mockall = "0.12"
dirs = "5.0"
toml = "0.8"
hex = "0.4"

# Python bindings (PyO3)
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
maturin = "1.7"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 2
debug = true
overflow-checks = true